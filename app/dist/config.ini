# RFID Cut Station - Machine Configuration
# Each Windows machine has its own copy of this file.
# Edit via browser Settings or edit this file directly.

[machine]
name = Cut Station 1

[database]
# Mode: sqlserver (production) or sqlite (testing only)
mode = sqlserver

# SQL Server connection
host = 172.25.147.35
port = 1433
database = FactoryDB_Line1
user = sa
password = Admin404@251121$$@@

# Table and column mapping (match your existing DB schema)
table = tCutBundCard
card_column = CardNo
size_column = SizeName
qty_column = CutQty
insert_time_column = Insert Time

[serial]
# COM port for ESP32 (leave blank for auto-detect in dashboard)
port =
baud = 115200

[dashboard]
web_port = 8084

[usb_reader]
# Enable global keyboard hook for USB HID RFID readers (keyboard-emulator type).
# Set to false if you ONLY use the ESP32 serial reader and don't have a USB HID reader.
enabled = true
